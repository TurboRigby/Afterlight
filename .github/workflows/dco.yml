# SPDX-License-Identifier: MPL-2.0
name: DCO
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  signoff:
    name: Sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test sign-off validation
        run: python3 tests/tooling/dco.py
      - name: Check introduced commits
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py --base "$DCO_BASE" --head "$DCO_HEAD"
