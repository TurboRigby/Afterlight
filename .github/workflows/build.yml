# SPDX-License-Identifier: MPL-2.0
name: Build and CPU tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS / ${{ matrix.configuration }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release, Sanitizers]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install cmake ninja sdl3 vulkan-headers vulkan-loader molten-vk glslang vulkan-validationlayers
      - name: Configure
        shell: bash
        run: |
          flags=()
          configuration='${{ matrix.configuration }}'
          if [[ "$configuration" == Sanitizers ]]; then
            configuration=Debug
            flags+=('-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined' '-DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined')
          fi
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE="$configuration" -DBUILD_TESTING=ON "${flags[@]}"
      - name: Build engine, editor, player and tests
        run: cmake --build build/ci --parallel 3
      - name: CPU and source-distribution tests
        # Hosted runners do not provide the interactive graphics session that
        # our Vulkan pixel/editor tests require. Run those on a local GPU.
        env:
          ASAN_OPTIONS: detect_leaks=0 # Apple AddressSanitizer does not support LeakSanitizer.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/ci --output-on-failure -LE graphics
